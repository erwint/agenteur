version: 2
project_name: coai
builds:
  - id: coai
    main: .
    binary: coai
    # Static, libc-free binaries: the native linux/amd64 build otherwise links
    # the runner's glibc and fails on older distros. SQLite is pure Go.
    env: [CGO_ENABLED=0]
    flags: ["-trimpath"]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  # No version in the name: scripts/run.sh and the updater fetch
  # releases/latest/download/coai_<os>_<arch>.tar.gz without knowing the tag.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  draft: false
  prerelease: auto
